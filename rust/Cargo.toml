[package]
name = "rive"
version = "0.1.3"
edition = "2024"
description = "Windows x64 Rust bindings for the Rive C++ runtime and D3D11 renderer"
links = "rive_native"
license = "MIT"
repository = "https://github.com/yufeih/rive-runtime"
include = ["/src/**", "/build.rs", "/lib/**", "/bin/**", "/Cargo.toml", "/LICENSE"]

[dependencies]
anyhow = "1"
png = "0.18"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_HiDpi"] }
